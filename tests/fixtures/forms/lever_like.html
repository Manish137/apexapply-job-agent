<!doctype html><html><body>
<form onsubmit="event.preventDefault(); window.__submitted = {
  name: document.querySelector('[name=name]').value,
  relocate: (document.querySelector('[name=relocate]:checked') || {}).value,
  info: document.querySelector('[name=comments]').value };
  document.body.innerHTML = '<div>Application submitted</div>';">
  <div class="application-question"><div class="application-label">Full name *</div>
    <input name="name" required></div>
  <div class="application-question"><div class="application-label">Email *</div>
    <input name="email" type="email" required></div>
  <div class="application-question"><div class="application-label">Resume/CV *</div>
    <input name="resume" type="file" required></div>
  <fieldset><legend>Are you willing to relocate? *</legend>
    <label><input type="radio" name="relocate" value="Yes" required> Yes</label>
    <label><input type="radio" name="relocate" value="No"> No</label></fieldset>
  <div class="application-question"><div class="application-label">Additional information</div>
    <textarea name="comments"></textarea></div>
  <button type="submit" id="btn-submit">Submit application</button>
</form></body></html>
