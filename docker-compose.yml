# ApexApply on a single VPS.
# Setup:  put this file and a filled-in .env (from .env.example) in one folder, then
#         docker compose up -d --build
# Update: docker compose up -d --build   (rebuilds from the latest commit on APEX_BRANCH)
services:
  apexapply:
    build: https://github.com/Manish137/apexapply-job-agent.git#${APEX_BRANCH:-main}
    container_name: apexapply-agent
    restart: unless-stopped
    ports:
      - "8765:8765"
    env_file: .env
    volumes:
      - apexapply_data:/app/data

volumes:
  apexapply_data:
